<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" role="img" aria-label="Ilustración de control de calidad: informe de laboratorio y matraz de análisis">
  <defs>
    <linearGradient id="lGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C6F24E" stop-opacity=".45"/>
      <stop offset="1" stop-color="#C6F24E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Halo de fondo -->
  <circle cx="250" cy="180" r="160" fill="url(#lGlow)"/>

  <!-- Documento: informe del lote -->
  <rect x="60" y="60" width="220" height="290" rx="16" fill="#FFFFFF" stroke="#E5E5E0"/>
  <rect x="60" y="60" width="220" height="54" rx="16" fill="#101215"/>
  <rect x="60" y="98" width="220" height="16" fill="#101215"/>
  <text x="86" y="93" font-family="Sora, Segoe UI, sans-serif" font-size="13"
        font-weight="700" letter-spacing="3" fill="#FFFFFF">INFORME DE LOTE</text>

  <!-- Líneas de texto simuladas -->
  <g fill="#E5E5E0">
    <rect x="86" y="140" width="120" height="9" rx="4.5"/>
    <rect x="86" y="162" width="168" height="9" rx="4.5"/>
    <rect x="86" y="184" width="140" height="9" rx="4.5"/>
  </g>

  <!-- Resultados con check verde -->
  <g>
    <circle cx="94" cy="224" r="10" fill="#C6F24E"/>
    <path d="M89.5 224l3.4 3.4 6.1-6.6" fill="none" stroke="#101215" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="114" y="219" width="132" height="9" rx="4.5" fill="#E5E5E0"/>

    <circle cx="94" cy="256" r="10" fill="#C6F24E"/>
    <path d="M89.5 256l3.4 3.4 6.1-6.6" fill="none" stroke="#101215" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="114" y="251" width="108" height="9" rx="4.5" fill="#E5E5E0"/>

    <circle cx="94" cy="288" r="10" fill="#C6F24E"/>
    <path d="M89.5 288l3.4 3.4 6.1-6.6" fill="none" stroke="#101215" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="114" y="283" width="146" height="9" rx="4.5" fill="#E5E5E0"/>
  </g>

  <!-- Sello aprobado -->
  <rect x="86" y="312" width="104" height="24" rx="12" fill="#101215"/>
  <text x="138" y="328" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif"
        font-size="10" font-weight="600" letter-spacing="2" fill="#C6F24E">APROBADO</text>

  <!-- Matraz de laboratorio -->
  <g transform="translate(292 132)">
    <rect x="34" y="-8" width="34" height="16" rx="5" fill="#101215"/>
    <path d="M42 8v44L8 128a16 16 0 0 0 14 24h58a16 16 0 0 0 14-24L60 52V8z"
          fill="#FFFFFF" stroke="#101215" stroke-width="5" stroke-linejoin="round"/>
    <path d="M18 110h66a16 16 0 0 1 10 18 16 16 0 0 1-12 6H22a16 16 0 0 1-14-24z"
          fill="#C6F24E"/>
    <circle cx="36" cy="122" r="5" fill="#FFFFFF" opacity=".65"/>
    <circle cx="60" cy="130" r="3.5" fill="#FFFFFF" opacity=".65"/>
    <circle cx="74" cy="119" r="2.5" fill="#FFFFFF" opacity=".65"/>
  </g>

  <!-- Etiqueta flotante de trazabilidad -->
  <g transform="translate(276 296)">
    <rect x="0" y="0" width="150" height="56" rx="14" fill="#101215"/>
    <circle cx="30" cy="28" r="13" fill="#C6F24E"/>
    <path d="M24.5 28l4 4 7-8" fill="none" stroke="#101215" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="24" font-family="Sora, Segoe UI, sans-serif" font-size="12"
          font-weight="700" fill="#FFFFFF">100 % trazable</text>
    <text x="52" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="9.5"
          fill="#FFFFFF" fill-opacity=".55">Análisis por lote</text>
  </g>
</svg>
