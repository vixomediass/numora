# Configuración de Netlify para Numora

# Directorio que Netlify publica
[build]
  publish = "."
  command = "echo 'Numora — no build needed'"

# Cachés: el navegador guarda estilos e imágenes durante 1 año
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML siempre se revisa (sin caché, para que cambios se vean ya)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirecciones: si visitan /index.html, los redirige a /
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
