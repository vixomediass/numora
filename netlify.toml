# Configuración de Netlify para Numora

# Directorio que Netlify publica
[build]
  publish = "."
  command = "echo 'Numora — no build needed'"

# Cachés: CSS y JS se revalidan siempre (sus nombres no llevan hash,
# así que un cambio tiene que llegar al instante). Las imágenes, 1 día.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# El HTML siempre se revisa (sin caché, para que cambios se vean ya)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirecciones: si visitan /index.html, los redirige a /
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
